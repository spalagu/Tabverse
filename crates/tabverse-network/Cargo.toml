[package]
name = "tabverse-network"
version = "0.1.1"
edition = "2021"
description = "Raw-byte data stream framing for Tabverse Remote."
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1.53.1", features = ["io-util"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "io-util"] }
