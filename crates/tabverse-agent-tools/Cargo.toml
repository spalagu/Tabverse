[package]
name = "tabverse-agent-tools"
version = "0.1.0"
edition = "2021"
description = "Tools the coding agent may invoke: file reads, writes, edits, shell commands, search."
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
unicode-normalization = "0.1.24"
tempfile = "3.23.0"
# ripgrep's own libraries: gitignore-aware walking, glob matching, and the
# search engine. Using them directly rather than through a wrapper keeps the
# behaviour identical to the tool developers already trust in their terminal.
ignore = "0.4"
globset = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.23.0"
