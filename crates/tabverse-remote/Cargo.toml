[package]
name = "tabverse-remote"
version = "0.1.0"
edition = "2021"
description = "iroh-based remote control: share a tab, join from anywhere."
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tabverse-proto = { path = "../tabverse-proto" }
iroh = "1.0.3"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-util", "sync", "time"] }
rand = "0.10.2"
data-encoding = "2.11.0"

[dev-dependencies]
tabverse-term = { path = "../tabverse-term" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
