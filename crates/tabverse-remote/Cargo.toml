[package]
name = "tabverse-remote"
version = "0.1.0"
edition = "2021"
description = "iroh-based remote control: share a tab, join from anywhere."
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tabverse-proto = { path = "../tabverse-proto" }
tabverse-network = { path = "../tabverse-network" }
iroh = "1.0.3"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-util", "sync", "time"] }
rand = "0.10.2"
data-encoding = "2.11.0"

[dev-dependencies]
# The data-stream integration test builds the injected Host client in this
# standalone crate. Production installs the same ring provider at the Tauri
# HTTP composition root; keeping this test-only preserves that boundary.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tabverse-term = { path = "../tabverse-term" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
