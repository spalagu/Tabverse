name: Cross-platform build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.paths.outputs.build }}
      resident: ${{ steps.paths.outputs.resident }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: paths
        name: Select platform checks
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "resident=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- apps crates packages src src-tauri Cargo.toml Cargo.lock package.json package-lock.json .github/workflows/check-windows.yml; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
          if git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- crates src-tauri Cargo.toml Cargo.lock package.json package-lock.json tools/prepare-resident-artifacts.mjs tools/prepare-resident-package-acceptance.mjs .github/workflows/check-windows.yml .github/workflows/resident-service.yml; then
            echo "resident=false" >> "$GITHUB_OUTPUT"
          else
            echo "resident=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - if: needs.changes.outputs.build == 'false'
        run: echo "No application or native build changes"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.build == 'true'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: needs.changes.outputs.build == 'true'
        with:
          node-version: 22.23.2
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: needs.changes.outputs.build == 'true'
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: needs.changes.outputs.build == 'true'
        with:
          workspaces: . -> target
          key: build-${{ matrix.os }}-${{ matrix.target }}

      - if: needs.changes.outputs.build == 'true' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - if: needs.changes.outputs.build == 'true'
        run: npm ci
      - if: needs.changes.outputs.build == 'true' && matrix.os == 'ubuntu-latest'
        run: npm run build
      - if: needs.changes.outputs.build == 'true'
        run: cargo clippy --workspace --all-targets --target ${{ matrix.target }} -- -D warnings

  resident-service:
    needs: changes
    uses: ./.github/workflows/resident-service.yml
    with:
      run_acceptance: ${{ needs.changes.outputs.resident == 'true' }}

  cross-platform:
    if: always()
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.build.result }}" = success

  packaging:
    if: always()
    needs: resident-service
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.resident-service.result }}" = success
