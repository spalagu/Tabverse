name: Resident package and service acceptance

on:
  workflow_call:

permissions:
  contents: read

jobs:
  resident-service:
    name: Resident package ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
            bundle: appimage
          - platform: macos
            os: macos-latest
            bundle: dmg
          - platform: windows
            os: windows-latest
            bundle: nsis
    env:
      TABVERSE_RESIDENT_PLATFORM_ACCEPTANCE: "1"
      TABVERSE_RESIDENT_ACCEPTANCE_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}
      # Ask linuxdeploy not to rewrite nested executables when supported.
      # Signed Linux workers are also packaged as base64 text because some
      # AppImage tool versions ignore this flag for nested ELF resources.
      NO_STRIP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: . -> target
          key: resident-package-${{ matrix.platform }}

      - name: Install Linux package and user-service prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            dbus-user-session \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Prepare Linux user service manager
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="/run/user/$(id -u)"
          sudo loginctl enable-linger "$USER"
          for attempt in $(seq 1 40); do
            if [ -S "$runtime_dir/bus" ]; then
              break
            fi
            sleep 0.25
          done
          test -S "$runtime_dir/bus"
          echo "XDG_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$runtime_dir/bus" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Create public acceptance signing seed
        shell: bash
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'TABVERSE_RESIDENT_SIGNING_KEY_HEX=' + '2a'.repeat(32) + '\n')"

      - name: Build and install package v1
        shell: bash
        run: |
          set -euo pipefail
          npm run tauri build -- --bundles "${{ matrix.bundle }}"
          node tools/prepare-resident-package-acceptance.mjs --phase v1 --version 0.0.1

      - name: Build package v2 without installing it
        shell: bash
        run: |
          set -euo pipefail
          node tools/prepare-resident-package-acceptance.mjs --set-version 0.0.2
          npm run tauri build -- --bundles "${{ matrix.bundle }}"

      - name: Install package v2 while runtimes live and exercise takeover
        run: >-
          cargo test -p tabverse-resident --test platform_service
          user_service_preserves_real_runtimes_across_gui_exit_and_package_reinstall --
          --ignored --exact --nocapture --test-threads=1

      - name: Remove acceptance service
        if: always()
        run: >-
          cargo test -p tabverse-resident --test platform_service
          cleanup_acceptance_service --
          --ignored --exact --nocapture --test-threads=1

      - name: Remove installed acceptance package
        if: always()
        run: node tools/prepare-resident-package-acceptance.mjs --cleanup unused

      - name: Remove Linux runner login persistence
        if: always() && runner.os == 'Linux'
        shell: bash
        run: sudo loginctl disable-linger "$USER"
