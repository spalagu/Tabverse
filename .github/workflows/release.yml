name: Publish release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to build as a release candidate
        required: true
        default: main
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: . -> target
          key: release-verify
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - if: github.event_name == 'push'
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - run: npm run check:release-source
      - run: npm run check:quality
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  build:
    needs: verify
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS x64 installer
            os: macos-26-intel
            target: x86_64-apple-darwin
            binary_arch: x86_64
            bundle: dmg
            extension: dmg
            asset_suffix: x64.dmg
          - label: macOS ARM64 installer
            os: macos-26
            target: aarch64-apple-darwin
            binary_arch: arm64
            bundle: dmg
            extension: dmg
            asset_suffix: aarch64.dmg
          - label: Windows x64 installer
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            extension: exe
            asset_suffix: windows-x64.exe
          - label: Windows ARM64 installer
            os: windows-latest
            target: aarch64-pc-windows-msvc
            bundle: nsis
            extension: exe
            asset_suffix: windows-arm64.exe
          - label: Linux x64 AppImage
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundle: appimage
            extension: AppImage
            asset_suffix: linux-x64.AppImage
          - label: Linux ARM64 AppImage
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundle: appimage
            extension: AppImage
            asset_suffix: linux-arm64.AppImage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: . -> target
          key: release-${{ matrix.os }}-${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: npm ci
      - run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
      - name: Name release asset
        id: asset
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            test "v${version}" = "$GITHUB_REF_NAME"
          fi
          source="$(find . -path "*/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}/*.${{ matrix.extension }}" -type f -print -quit)"
          test -n "$source"
          asset="Tabverse_${version}_${{ matrix.asset_suffix }}"
          cp "$source" "$asset"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          checksum="SHA256SUMS-${{ matrix.target }}"
          if [[ '${{ runner.os }}' == 'macOS' ]]; then
            shasum -a 256 "$asset" > "$checksum"
            shasum -a 256 -c "$checksum"
          else
            sha256sum "$asset" > "$checksum"
            sha256sum -c "$checksum"
          fi
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

          if [[ '${{ matrix.target }}' == *-apple-darwin ]]; then
            mount_point="$(mktemp -d "${RUNNER_TEMP}/tabverse-release.XXXXXX")"
            device=""
            cleanup() {
              if [[ -n "$device" ]]; then hdiutil detach "$device" -force >/dev/null 2>&1 || true; fi
              rmdir "$mount_point" >/dev/null 2>&1 || true
            }
            trap cleanup EXIT
            device="$(hdiutil attach "$asset" -nobrowse -readonly -mountpoint "$mount_point" | awk '/^\/dev\// { print $1; exit }')"
            app="$(find "$mount_point" -maxdepth 2 -name 'Tabverse.app' -type d -print -quit)"
            test -n "$app"
            executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
            binary="$app/Contents/MacOS/$executable"
            test -x "$binary"
            lipo -archs "$binary" | tr ' ' '\n' | grep -Fx '${{ matrix.binary_arch }}'
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign --display --verbose=2 "$app" 2>&1 | grep -Fx 'Signature=adhoc'
          fi

          info="build-info-${{ matrix.target }}.txt"
          {
            printf 'version=%s\n' "$version"
            printf 'commit=%s\n' "$(git rev-parse HEAD)"
            printf 'target=%s\n' '${{ matrix.target }}'
            if [[ '${{ matrix.target }}' == *-apple-darwin ]]; then
              printf 'signing=ad-hoc\n'
              printf 'notarized=no\n'
            else
              printf 'paid_code_signing=no\n'
            fi
          } > "$info"
          echo "info=$info" >> "$GITHUB_OUTPUT"
      - name: Stage distribution notice
        shell: bash
        run: cp docs/distribution.md distribution.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ steps.asset.outputs.asset }}
            ${{ steps.asset.outputs.checksum }}
            ${{ steps.asset.outputs.info }}
            distribution.md
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Write release checksums
        working-directory: release-assets
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Write release notes
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          printf '## Tabverse %s\n\n' "$version" > release-notes.md
          if [ "$version" = "0.0.1" ]; then
            cat >> release-notes.md <<'EOF'

          Tabverse is a cross-platform workspace that brings terminals, AI agents, files, web pages, and session management into one tabbed experience. It also lets you securely join a shared terminal from another device.

          ### Included in the first public release

          - **Real terminals and command blocks** — run a shell through a PTY, retain commands, exit status, duration, and output, then find, copy, or rerun them.
          - **Agent tabs** — follow an agent conversation, tool calls, permission decisions, and turn cancellation in the same workspace.
          - **Secure remote collaboration** — share terminals peer-to-peer with end-to-end encryption through iroh. Multiple collaborators can view or type, and a self-contained browser client joins without installation.
          - **File workspace** — browse files and Git status, compare edits with HEAD, and preview images, PDFs, media, DOCX, and XLSX inline.
          - **Built-in browser tabs** — use native web views rather than iframes, with a focused address bar plus navigation, reload, and open-in-default-browser actions.
          - **Fast tab and session management** — organize tabs into groups, pin and reorder them, switch fuzzily, split terminals, and restore sessions after restart.

          ### Quality checks

          Every commit is verified by GitHub Actions with frontend and Rust tests, cross-platform builds, security scanning, browser UI checks, and interaction checks through a browser debugging channel.
          EOF
          elif [ "$version" = "0.1.0" ]; then
            cat >> release-notes.md <<'EOF'

          Tabverse V3 将桌面工作区、可恢复 Runtime、统一内容系统和语义 Remote 能力整合到一套跨平台架构中。Remote Browser 在 viewer 端渲染，并通过 Host 网络访问 localhost、LAN、VPN、内部 DNS 和 Host 信任的 HTTPS；不会同步 Host Browser 的 cookie、localStorage、DOM 或历史。

          ### macOS 安装提示

          macOS DMG 使用 ad-hoc 签名，**没有 Apple Developer ID，也没有 notarize**。首次打开时，请在 Finder 中右键 `Tabverse.app` 选择“打开”，或在“系统设置 → 隐私与安全性”中仅允许 Tabverse。不要全局关闭 Gatekeeper。详细步骤见 release 中的 `distribution.md`。

          ### 产物校验

          下载与设备架构匹配的安装包，并使用本 release 的 `SHA256SUMS` 校验文件。
          EOF
          else
            cat >> release-notes.md <<'EOF'
          This release contains the changes and new features collected since the previous Tabverse release. The generated changelog below links every included pull request and commit.
          EOF
          fi
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release $GITHUB_REF_NAME" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Tabverse ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            --generate-notes \
            --verify-tag
