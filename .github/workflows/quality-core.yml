name: Quality core

on:
  pull_request:
  push:
    branches: [main, architecture-v3]
  workflow_dispatch:

# Temporary on this branch only: the final clean commit restores contents: read.
permissions:
  contents: write

concurrency:
  group: quality-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: . -> target
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run check:quality
      - name: Generate lockfile snapshot for branch cleanup
        if: github.event_name == 'pull_request' && github.head_ref == 'v3-host-network-gateway'
        shell: bash
        run: |
          cargo generate-lockfile
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "temp: generated Cargo.lock snapshot"
          git push --force origin HEAD:refs/heads/v3-lock-generated-temp
