name: macOS V3 acceptance DMGs

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to build
        required: true
        default: architecture-v3-base
        type: string

permissions:
  contents: read

concurrency:
  group: macos-v3-acceptance-${{ inputs.source_ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.label }} DMG
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Apple Silicon
            os: macos-26
            target: aarch64-apple-darwin
            binary_arch: arm64
            artifact_arch: arm64
          - label: Intel
            os: macos-26-intel
            target: x86_64-apple-darwin
            binary_arch: x86_64
            artifact_arch: x64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: . -> target
          key: macos-v3-acceptance-${{ matrix.os }}-${{ matrix.target }}

      - run: npm ci

      - name: Build DMG
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles dmg

      - name: Stage and inspect artifact
        id: artifact
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          commit="$(git rev-parse HEAD)"
          short_commit="$(git rev-parse --short=12 HEAD)"
          source="$(find . -path "*/${{ matrix.target }}/release/bundle/dmg/*.dmg" -type f -print -quit)"
          test -n "$source"

          output_dir="macos-v3-acceptance-${{ matrix.artifact_arch }}"
          mkdir -p "$output_dir"
          asset="Tabverse_${version}_${short_commit}_macos-${{ matrix.artifact_arch }}.dmg"
          cp "$source" "$output_dir/$asset"
          cp docs/acceptance/macos-v3.md "$output_dir/验收说明.md"
          (cd "$output_dir" && shasum -a 256 "$asset" > SHA256SUMS)
          (cd "$output_dir" && shasum -a 256 -c SHA256SUMS)

          mount_point="$(mktemp -d "${RUNNER_TEMP}/tabverse-v3.XXXXXX")"
          device=""
          cleanup() {
            if [[ -n "$device" ]]; then hdiutil detach "$device" -force >/dev/null 2>&1 || true; fi
            rmdir "$mount_point" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          device="$(hdiutil attach "$output_dir/$asset" -nobrowse -readonly -mountpoint "$mount_point" | awk '/^\/dev\// { print $1; exit }')"
          app="$(find "$mount_point" -maxdepth 2 -name 'Tabverse.app' -type d -print -quit)"
          test -n "$app"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          binary="$app/Contents/MacOS/$executable"
          test -x "$binary"
          lipo -archs "$binary" | tr ' ' '\n' | grep -Fx '${{ matrix.binary_arch }}'
          codesign --verify --deep --strict --verbose=2 "$app"

          {
            printf 'source_ref=%s\n' "$SOURCE_REF"
            printf 'commit=%s\n' "$commit"
            printf 'target=%s\n' '${{ matrix.target }}'
            printf 'binary_architectures=%s\n' "$(lipo -archs "$binary")"
            printf 'signing=ad-hoc\n'
            printf 'notarized=no\n'
            printf 'notarization_note=This acceptance workflow has no Apple notarization credentials and does not submit the app to Apple.\n'
            printf '\n[codesign]\n'
            codesign --display --verbose=2 "$app" 2>&1 || true
            printf '\n[gatekeeper]\n'
            spctl --assess --verbose=2 --type execute "$app" 2>&1 || true
            printf '\n[stapler]\n'
            xcrun stapler validate "$app" 2>&1 || true
          } > "$output_dir/build-info.txt"

          echo "path=$output_dir" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-v3-acceptance-${{ matrix.artifact_arch }}-${{ github.run_number }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 14
