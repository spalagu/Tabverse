name: macOS acceptance DMGs

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to build
        required: true
        default: architecture-v3-base
        type: string

permissions:
  contents: read

concurrency:
  group: macos-acceptance-${{ inputs.source_ref }}
  cancel-in-progress: false

env:
  WASM_BINDGEN_VERSION: 0.2.126
  WASM_BINDGEN_SHA256: 064948d58e2d6c0a745216477a639ba696216d6309aaa902939d1b865b1d869d
  WASI_SDK_TAG: wasi-sdk-33
  WASI_SDK_FULL: "33.0"
  WASI_SDK_SHA256: 0ba8b5bfaeb2adf3f29bab5841d76cf5318ab8e1642ea195f88baba1abd47bce

jobs:
  join-viewer:
    name: Build matching Join Viewer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache Cargo registry and target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: acceptance-viewer-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            acceptance-viewer-cargo-${{ runner.os }}-
      - name: Cache wasi-sdk and wasm-bindgen
        id: toolchain-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/wasi-sdk
            ~/.local/bin/wasm-bindgen
          key: acceptance-viewer-toolchain-${{ runner.os }}-wasi${{ env.WASI_SDK_FULL }}-bindgen${{ env.WASM_BINDGEN_VERSION }}
      - name: Install wasi-sdk and wasm-bindgen
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 -o /tmp/wasi-sdk.tar.gz \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/${WASI_SDK_TAG}/wasi-sdk-${WASI_SDK_FULL}-x86_64-linux.tar.gz"
          printf '%s  %s\n' "$WASI_SDK_SHA256" /tmp/wasi-sdk.tar.gz | sha256sum --check --strict
          mkdir -p ~/wasi-sdk
          tar -xzf /tmp/wasi-sdk.tar.gz -C ~/wasi-sdk --strip-components=1
          curl -fsSL --retry 3 -o /tmp/wasm-bindgen.tar.gz \
            "https://github.com/rustwasm/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          printf '%s  %s\n' "$WASM_BINDGEN_SHA256" /tmp/wasm-bindgen.tar.gz | sha256sum --check --strict
          tar -xzf /tmp/wasm-bindgen.tar.gz -C /tmp
          mkdir -p ~/.local/bin
          mv "/tmp/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen" \
            ~/.local/bin/wasm-bindgen
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build hosted and offline Join Viewer
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          commit="$(git rev-parse HEAD)"
          WASI_SDK="$HOME/wasi-sdk" TABVERSE_BUILD_ID="$commit" bash tools/build-web.sh
      - name: Scan generated Viewer artifacts for plaintext secrets
        run: npm run check:secrets -- --require-artifact dist-pages --require-artifact dist-web
      - name: Stage matching Viewer artifact
        id: artifact
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          short_commit="$(git rev-parse --short=12 HEAD)"
          output_dir="join-acceptance-${short_commit}"
          mkdir -p "$output_dir/join"
          cp -R dist-pages/. "$output_dir/join/"
          cp dist-web/tabverse-remote.html "$output_dir/"
          {
            printf 'source_ref=%s\n' '${{ inputs.source_ref }}'
            printf 'commit=%s\n' "$commit"
            printf 'hosted_path=/Tabverse/join/\n'
            printf 'deployed=no\n'
          } > "$output_dir/build-info.txt"
          (
            cd "$output_dir"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          echo "path=$output_dir" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: join-acceptance-${{ github.run_number }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build ${{ matrix.label }} DMG
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Apple Silicon
            os: macos-26
            target: aarch64-apple-darwin
            binary_arch: arm64
            asset_arch: arm64
          - label: Intel
            os: macos-26-intel
            target: x86_64-apple-darwin
            binary_arch: x86_64
            asset_arch: x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: . -> target
          key: macos-acceptance-${{ matrix.os }}-${{ matrix.target }}
      - run: npm ci
      - name: Build DMG
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles dmg
      - name: Stage and inspect artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          commit="$(git rev-parse HEAD)"
          short_commit="$(git rev-parse --short=12 HEAD)"
          source="$(find . -path "*/${{ matrix.target }}/release/bundle/dmg/*.dmg" -type f -print -quit)"
          test -n "$source"

          output_dir="macos-acceptance-${{ matrix.asset_arch }}"
          mkdir -p "$output_dir"
          asset="Tabverse_${version}_${short_commit}_macos-${{ matrix.asset_arch }}.dmg"
          cp "$source" "$output_dir/$asset"
          (cd "$output_dir" && shasum -a 256 "$asset" > SHA256SUMS)

          mount_point="$(mktemp -d "${RUNNER_TEMP}/tabverse-acceptance.XXXXXX")"
          device=""
          cleanup() {
            if [[ -n "$device" ]]; then hdiutil detach "$device" -force >/dev/null 2>&1 || true; fi
            rmdir "$mount_point" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          device="$(hdiutil attach "$output_dir/$asset" -nobrowse -readonly -mountpoint "$mount_point" | awk '/^\/dev\// { print $1; exit }')"
          app="$(find "$mount_point" -maxdepth 2 -name 'Tabverse.app' -type d -print -quit)"
          test -n "$app"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          binary="$app/Contents/MacOS/$executable"
          test -x "$binary"
          lipo -archs "$binary" | tr ' ' '\n' | grep -Fx '${{ matrix.binary_arch }}'

          {
            printf 'source_ref=%s\n' '${{ inputs.source_ref }}'
            printf 'commit=%s\n' "$commit"
            printf 'target=%s\n' '${{ matrix.target }}'
            printf 'binary_architectures=%s\n' "$(lipo -archs "$binary")"
            printf 'signing=ad-hoc\n'
            printf 'notarized=no\n'
            printf 'notarization_note=This acceptance workflow does not submit artifacts to Apple notarization.\n'
            printf '\n[codesign]\n'
            codesign --display --verbose=2 "$app" 2>&1 || true
            printf '\n[gatekeeper]\n'
            spctl --assess --verbose=2 --type execute "$app" 2>&1 || true
            printf '\n[stapler]\n'
            xcrun stapler validate "$app" 2>&1 || true
          } > "$output_dir/build-info.txt"

          echo "path=$output_dir" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-acceptance-${{ matrix.asset_arch }}-${{ github.run_number }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 14
