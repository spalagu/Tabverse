[workspace]
resolver = "2"
members = [
  "src-tauri",
  "crates/tabverse-proto",
  "crates/tabverse-term",
  "crates/tabverse-remote",
  "crates/tabverse-resident",
  "crates/tabverse-fs",
  "crates/tabverse-web",
]

[workspace.package]
license = "Apache-2.0"
homepage = "https://github.com/spalagu/Tabverse"
repository = "https://github.com/spalagu/Tabverse"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Tauri CEF is not published on crates.io yet. Pin the public Tabverse fork to
# an immutable revision based on Alpha.25 so every developer and CI job resolves
# the same reviewed CEF runtime and handler fixes.
[patch.crates-io]
tauri = { git = "https://github.com/spalagu/tauri.git", rev = "3158a834eadbece24b9709e9ce45c32062492b69" }
tauri-build = { git = "https://github.com/spalagu/tauri.git", rev = "3158a834eadbece24b9709e9ce45c32062492b69" }

[profile.release]
lto = true
codegen-units = 1
strip = true

# Debug info for this dependency tree (iroh + tauri) costs several GB of disk
# and buys little for a GUI app we debug through logs. Keep line tables only.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false
