[workspace]
resolver = "2"
members = [
  "src-tauri",
  "crates/tabverse-proto",
  "crates/tabverse-term",
  "crates/tabverse-remote",
  "crates/tabverse-resident",
  "crates/tabverse-fs",
  "crates/tabverse-web",
]

[workspace.package]
license = "Apache-2.0"
homepage = "https://github.com/spalagu/Tabverse"
repository = "https://github.com/spalagu/Tabverse"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Tauri CEF is not published on crates.io yet. Pin the public Alpha.25 tag so
# every developer and CI job resolves the same source revision. The follow-up
# CEF stabilization patch is tracked separately until it has a public ref.
[patch.crates-io]
tauri = { git = "https://github.com/tauri-apps/tauri.git", tag = "tauri-cef-v3.0.0-alpha.25" }
tauri-build = { git = "https://github.com/tauri-apps/tauri.git", tag = "tauri-cef-v3.0.0-alpha.25" }

[profile.release]
lto = true
codegen-units = 1
strip = true

# Debug info for this dependency tree (iroh + tauri) costs several GB of disk
# and buys little for a GUI app we debug through logs. Keep line tables only.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false
